<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPERPUMP coin</title>
<meta name="description" content="A HYPERPUMP coin: its Hyperliquid market, side, take-profit tier and fee progress.">
<meta property="og:site_name" content="HYPERPUMP">
<meta property="og:title" content="A coin on HYPERPUMP">
<meta property="og:image" content="__ORIGIN__/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@HyperPumpSol">
<meta name="twitter:image" content="__ORIGIN__/og.png">
<meta name="theme-color" content="#081114">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.back{display:inline-block;margin:6px 0 18px;color:var(--dim);font-weight:600}.back:hover{color:var(--pump)}
.ch{display:flex;gap:22px;align-items:center;margin-bottom:22px}
.cav{width:112px;height:112px;border-radius:28px;flex:none;overflow:hidden;display:grid;place-items:center;font:800 52px var(--disp);color:#04110F}
.cav img{width:100%;height:100%;object-fit:cover}
.ch h1{font:800 clamp(34px,6vw,56px)/1 var(--disp);letter-spacing:-.03em}
.ch .nm{color:var(--dim);font-size:18px;margin:4px 0 10px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tg{font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--s3)}
.tg.l{color:var(--long);border-color:rgba(60,228,136,.4)}.tg.s{color:var(--pink);border-color:rgba(240,112,138,.4)}.tg.m{color:var(--mint)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.pn{background:var(--s1);border:2px solid var(--s3);border-radius:22px;padding:22px;min-width:0}
.pn h2{font:800 22px/1.1 var(--disp);margin-bottom:14px}
.big{font:800 44px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font:600 18px var(--body);color:var(--dim);letter-spacing:0}
.cbar{height:16px;border-radius:99px;background:var(--bg);border:2px solid var(--s3);overflow:hidden;margin:14px 0 8px}
.cbar i{display:block;height:100%;background:var(--teal);border-radius:99px}.cbar.rdy i{background:var(--long)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:0}
.kv dt{color:var(--dim)}.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.st{display:flex;gap:10px;align-items:flex-start;background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.empty{padding:60px 0;text-align:center;color:var(--dim)}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.ch{gap:16px}.cav{width:84px;height:84px;font-size:38px;border-radius:22px}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="/">
      <svg viewBox="40 40 432 432" aria-hidden="true"><defs><clipPath id="hpc"><rect x="156" y="56" width="200" height="400" rx="100"/></clipPath><linearGradient id="hpl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97FCE4"/><stop offset="1" stop-color="#50D2C1"/></linearGradient></defs><g transform="translate(512 0) scale(-1 1)"><g transform="rotate(-30 256 256)"><rect x="156" y="56" width="200" height="400" rx="100" fill="#0E1F22"/>
<g clip-path="url(#hpc)"><path d="M120 236 C170 196 210 196 256 236 S342 276 392 236 V480 H120 Z" fill="url(#hpl)"/>
<path d="M120 236 C170 196 210 196 256 236 S342 276 392 236" fill="none" stroke="#E6FFF8" stroke-width="6" stroke-linecap="round" opacity=".8"/>
<circle cx="214" cy="330" r="14" fill="#081114" opacity=".35"/><circle cx="288" cy="372" r="9" fill="#081114" opacity=".35"/><circle cx="262" cy="300" r="6" fill="#081114" opacity=".35"/></g>
<rect x="156" y="56" width="200" height="400" rx="100" fill="none" stroke="#54F58E" stroke-width="16"/></g></g></svg>
      HYPERPUMP
    </a>
    <span class="pw">Perps on Hyperliquid</span>
    <div class="sp"></div>
    <div class="links"><a href="/#board">Coins</a><a href="/launch">Launch</a><a href="/#how">How it works</a><a href="/docs">Docs</a><a href="https://x.com/HyperPumpSol" target="_blank" rel="noopener" aria-label="HYPERPUMP on X"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M18.2 2.2h3.3l-7.2 8.2 8.5 11.2h-6.7l-5.2-6.8-6 6.8H1.6l7.7-8.8L1.2 2.2H8l4.7 6.2 5.5-6.2Zm-1.2 17.5h1.8L7.1 4H5.2l11.8 15.7Z"/></svg></a></div>
    <a class="btn main" href="/launch">Launch a coin</a>
  </nav>
  <main id="app" aria-live="polite"><p class="empty">Loading coin…</p></main>
  <footer><span>HYPERPUMP · launches on pump.fun, trades on Hyperliquid</span><span><a href="https://x.com/HyperPumpSol" target="_blank" rel="noopener">@HyperPumpSol</a> · Not financial advice.</span></footer>
</div>
<script>
(function () {
  var TIER = { 2: 'Chill', 5: 'Degen', 10: 'Hyper-Degen' };
  var app = document.getElementById('app');
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function usd(v) { return '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function ago(t) { var s = Math.max(1, Math.round((Date.now() - t) / 1000)); if (s < 60) return s + 's'; if (s < 3600) return Math.round(s / 60) + 'm'; if (s < 86400) return Math.round(s / 3600) + 'h'; return Math.round(s / 86400) + 'd'; }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function mint() { var p = location.pathname.split('/').filter(Boolean).pop() || ''; return /\.html$/.test(p) ? location.hash.slice(1) : p; }
  function notFound(msg) { app.innerHTML = '<a class="back" href="/#board">← All coins</a><p class="empty">' + esc(msg) + '</p>'; }
  var m = mint();
  if (!m) return notFound('No coin selected.');
  fetch('/api/coin/' + encodeURIComponent(m)).then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || 'Not found'); return j; }); }).then(function (d) {
    var c = d.coin, thr = d.thresholdUsd, lev = c.lev || 10, label = c.market.indexOf(':') > 0 ? c.market.split(':').slice(1).join(':') : c.market;
    var fee = c.feeUsd, pct = fee == null ? 0 : Math.min(100, Math.round(fee / thr * 100));
    var move = ((c.tier - 1) / lev * 100), bust = 100 / lev, pos = thr * lev, profit = thr * (c.tier - 1);
    document.title = '$' + c.symbol + ' · HYPERPUMP';
    var bg = c.image ? 'background:#000' : 'background:linear-gradient(135deg,hsl(' + hue(c.symbol) + ' 70% 62%),hsl(' + (hue(c.symbol) - 22) + ' 65% 44%))';
    var av = '<div class="cav" style="' + bg + '">' + (c.image ? '<img alt="" src="' + esc(c.image) + '" onerror="this.remove()">' : esc(c.symbol.charAt(0))) + '</div>';
    var short_ = c.side === 'short';
    app.innerHTML = '<a class="back" href="/#board">← All coins</a>' +
      '<div class="ch">' + av + '<div><h1>$' + esc(c.symbol) + '</h1><div class="nm">' + esc(c.name) + ' · launched ' + ago(c.createdAt) + ' ago</div>' +
      '<div class="tags"><span class="tg ' + (short_ ? 's' : 'l') + '">' + (short_ ? 'SHORT ↓' : 'LONG ↑') + '</span><span class="tg m">' + esc(label) + ' ' + lev + 'x</span><span class="tg">' + esc(TIER[c.tier] || '') + ' ' + c.tier + 'x</span></div></div></div>' +
      '<div class="st"><span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:var(--sun);flex:none;margin-top:7px"></span><span><b>Position not live yet.</b> Fees stack now. The Hyperliquid bot that opens the position is still being built.</span></div>' +
      '<div class="grid2"><section class="pn"><h2>Fee progress</h2>' +
      '<div class="big">' + (fee == null ? '…' : usd(fee)) + ' <small>of $' + thr + '</small></div>' +
      '<div class="cbar' + (c.ready ? ' rdy' : '') + '"><i style="width:' + (c.ready ? 100 : pct) + '%"></i></div>' +
      '<div class="d">' + (c.ready ? 'Ready. Waiting for the Hyperliquid bot.' : pct + '% of the way to opening') + '</div>' +
      '<div class="links"><a class="btn" href="https://pump.fun/coin/' + esc(c.mint) + '" target="_blank" rel="noopener">Trade on pump.fun</a><a class="btn" href="https://solscan.io/token/' + esc(c.mint) + '" target="_blank" rel="noopener">Solscan</a></div></section>' +
      '<section class="pn"><h2>The position</h2><dl class="kv">' +
      '<dt>Market</dt><dd>' + esc(label) + (c.market.indexOf(':') > 0 ? ' (' + esc(c.market.split(':')[0]) + ')' : '') + '</dd>' +
      '<dt>Side and leverage</dt><dd>' + (short_ ? 'Short' : 'Long') + ' ' + lev + 'x</dd>' +
      '<dt>Opens at</dt><dd>$' + thr + ' of fees</dd>' +
      '<dt>Position size</dt><dd>$' + pos.toLocaleString('en-US') + '</dd>' +
      '<dt>Takes profit at</dt><dd>' + c.tier + 'x margin, ' + (move < 10 ? move.toFixed(1) : Math.round(move)) + '% move</dd>' +
      '<dt>Busts at</dt><dd>' + bust.toFixed(1) + '% against</dd>' +
      '<dt>Odds</dt><dd>about 1 in ' + c.tier + '</dd>' +
      '<dt>If it wins</dt><dd>about ' + usd(profit) + ' profit</dd></dl>' +
      '<p class="d" style="margin-top:14px;font-size:14px">A win buys back and burns this coin with 80% of the profit, and buys and burns HYPERPUMP with the other 20%. A bust and the coin starts stacking fees again. Odds ignore fees, funding and slippage.</p></section></div>';
  }).catch(function (e) { notFound(/not found/i.test(e.message) ? 'This coin is not listed on HYPERPUMP.' : 'Could not load this coin. Try again in a moment.'); });
})();
</script>
</body>
</html>
